[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agdirlabs-email"
dynamic = ["version"]
description = "Official Python SDK for Agdir Email — programmatic SMTP for developers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agdir AS" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1"]
keywords = ["email", "smtp", "transactional-email", "email-api", "webhooks", "django", "agdir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]

[project.optional-dependencies]
django = ["django>=4.2"]

[project.urls]
Homepage = "https://agdir.email"
Documentation = "https://github.com/AgdirAS/agdirlabs-sdks/tree/main/python#readme"
Repository = "https://github.com/AgdirAS/agdirlabs-sdks"
Issues = "https://github.com/AgdirAS/agdirlabs-sdks/issues"
Changelog = "https://github.com/AgdirAS/agdirlabs-sdks/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "django>=4.2",
    "mypy>=1.10",
    "ruff>=0.6",
    "build>=1.2",
]

[tool.hatch.version]
path = "src/agdirlabs_email/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agdirlabs_email"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Keep `Optional[...]`/`List[...]`: Python 3.9 evaluates dataclass annotations at runtime.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Django must be configured before its mail modules are imported.
"tests/test_django.py" = ["E402"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["django", "django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["agdirlabs_email.django", "tests.test_django"]
disallow_subclassing_any = false
disallow_untyped_calls = false
