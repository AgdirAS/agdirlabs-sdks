name: Python release

# Push a tag `python/v<version>` (e.g. `python/v0.1.0`) matching `__version__` in python/src/agdirlabs_email/_version.py.
# Publishes to PyPI via Trusted Publishing (OIDC): no PyPI token is stored anywhere. PyPI must list this repo,
# this workflow (python-release.yml) and the `pypi` environment as the project's trusted publisher.
on:
  push:
    tags: ['python/v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#python/v}"
          actual=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agdirlabs_email/_version.py)
          test "$tag" = "$actual" || { echo "tag $tag != __version__ $actual"; exit 1; }
      - run: python -m pip install -U pip
      - run: pip install -e . --group dev
      - run: ruff check . && mypy && pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agdirlabs-email/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
