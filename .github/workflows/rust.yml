name: Rust

on:
  push:
    branches: [main]
    paths: [rust/**, .github/workflows/rust.yml]
  pull_request:
    paths: [rust/**, .github/workflows/rust.yml]

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Docs build without warnings
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test (default features)
        run: cargo test --locked
      - name: Test (all features, incl. blocking and native-tls)
        run: cargo test --locked --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Cargo.lock is resolved MSRV-aware (rust/.cargo/config.toml), so the library builds on 1.75.
      - run: cargo check --locked --lib --all-features
      - run: cargo check --locked --lib --no-default-features --features native-tls
