name: Python

on:
  push:
    branches: [main]
    paths: [python/**, .github/workflows/python.yml]
  pull_request:
    paths: [python/**, .github/workflows/python.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # `--group` (PEP 735 dependency groups) needs pip ≥ 25.1.
      - run: python -m pip install -U pip
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "from agdirlabs_email import AgdirEmail; assert AgdirEmail('re_x').base_url == 'https://api.agdir.email'"
