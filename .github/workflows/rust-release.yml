name: Rust release

# Publish the `agdirlabs-email` crate: push a tag `rust/v<version>`, e.g. `rust/v0.1.0`.
# Uses crates.io Trusted Publishing (OIDC): no crates.io token is stored anywhere. The crate must
# list this repo + workflow (rust-release.yml) + environment (crates-io) as a trusted publisher
# on crates.io — see rust/README.md, "Releasing".
on:
  push:
    tags: ['rust/v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io Trusted Publishing
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#rust/v}"
          actual=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$tag" = "$actual" || { echo "tag $tag != Cargo.toml $actual"; exit 1; }
      - run: cargo test --locked --all-features
      - run: cargo publish --locked --dry-run
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
