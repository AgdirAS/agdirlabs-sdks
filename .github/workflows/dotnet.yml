name: .NET

on:
  push:
    branches: [main]
    paths: [dotnet/**, .github/workflows/dotnet.yml]
  pull_request:
    paths: [dotnet/**, .github/workflows/dotnet.yml]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    working-directory: dotnet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - name: Test (net8.0, net10.0)
        run: dotnet test -c Release --no-build
      - name: Test the netstandard2.0 build
        run: dotnet test -c Release -p:TestNetStandard=true --framework net8.0
      - name: Pack
        run: dotnet pack -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: dotnet/artifacts/*

  netfx:
    # .NET Framework 4.7.2 consuming the netstandard2.0 build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release --framework net472
