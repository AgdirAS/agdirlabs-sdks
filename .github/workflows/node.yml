name: Node.js

on:
  push:
    branches: [main]
    paths: [packages/**, pnpm-lock.yaml, .github/workflows/node.yml]
  pull_request:
    paths: [packages/**, pnpm-lock.yaml, .github/workflows/node.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # pnpm itself needs Node ≥ 22.13, so install and build on 22, then test on the matrix version.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test @agdirlabs/email on Node ${{ matrix.node }}
        working-directory: packages/email
        run: node node_modules/vitest/vitest.mjs run
      - name: Smoke-test the built @agdirlabs/email (ESM + CJS)
        working-directory: packages/email
        run: |
          node --input-type=module -e "import { AgdirEmail } from './dist/index.js'; if (new AgdirEmail('re_x').baseUrl !== 'https://api.agdir.email') process.exit(1)"
          node -e "const { AgdirEmail } = require('./dist/index.cjs'); if (new AgdirEmail('re_x').baseUrl !== 'https://api.agdir.email') process.exit(1)"
      - name: Test @agdirlabs/nodemailer-transport on Node ${{ matrix.node }}
        working-directory: packages/nodemailer-transport
        run: node node_modules/vitest/vitest.mjs run
      - name: Smoke-test the built @agdirlabs/nodemailer-transport (ESM + CJS)
        working-directory: packages/nodemailer-transport
        run: |
          node --input-type=module -e "import nodemailer from 'nodemailer'; import { agdirTransport } from './dist/index.js'; const t = nodemailer.createTransport(agdirTransport({ apiKey: 're_x' })); if (t.transporter.name !== 'AgdirEmail') process.exit(1)"
          node -e "const nodemailer = require('nodemailer'); const { agdirTransport } = require('./dist/index.cjs'); const t = nodemailer.createTransport(agdirTransport({ apiKey: 're_x' })); if (t.transporter.name !== 'AgdirEmail') process.exit(1)"
