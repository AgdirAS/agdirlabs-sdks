[package]
name = "agdirlabs-email"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust SDK for Agdir Email: programmatic SMTP for developers, hosted in the EU."
authors = ["Agdir AS <post@agdir.no>"]
license = "MIT"
homepage = "https://agdir.email"
repository = "https://github.com/AgdirAS/agdirlabs-sdks"
documentation = "https://docs.rs/agdirlabs-email"
readme = "README.md"
keywords = ["email", "smtp", "transactional-email", "agdir", "api"]
categories = ["email", "api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "agdirlabs_email"

[features]
default = ["rustls-tls"]
## TLS via rustls with the Mozilla root certificates (no OpenSSL needed).
rustls-tls = ["reqwest/rustls-tls"]
## TLS via the platform's native library (OpenSSL, Secure Transport, SChannel).
native-tls = ["reqwest/native-tls"]
## A synchronous client in `agdirlabs_email::blocking`.
blocking = ["tokio/rt"]

[dependencies]
base64 = "0.22"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
http = "1"
httpdate = "1"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.36", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.38", default-features = false, features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
http = "1"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
time = { version = "0.3.36", features = ["macros"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
